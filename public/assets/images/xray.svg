<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="xg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6557D2"/>
      <stop offset="100%" stop-color="#5246B8"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="400" height="300" fill="none"/>
  <!-- X-ray film frame -->
  <rect x="140" y="40" width="120" height="160" rx="6" fill="#111216" stroke="#334155" stroke-width="1.5"/>
  <!-- Lung silhouettes -->
  <path d="M170 140 Q160 120 165 100 T190 100 Q195 120 185 140 Z" fill="none" stroke="#A99AFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M230 140 Q240 120 235 100 T210 100 Q205 120 215 140 Z" fill="none" stroke="#A99AFF" stroke-width="2" stroke-linecap="round"/>
  <!-- Rib cage -->
  <path d="M150 160 Q155 130 160 100 M155 170 Q160 130 165 100 M160 180 Q165 130 170 100" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <path d="M250 160 Q245 130 240 100 M245 170 Q240 130 235 100 M240 180 Q235 130 230 100" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <!-- Spine -->
  <line x1="200" y1="40" x2="200" y2="200" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <!-- Density marker -->
  <circle cx="195" cy="135" r="3" fill="#6557D2"/>
  <circle cx="205" cy="130" r="2" fill="#A99AFF"/>
  <!-- HUD corner -->
  <rect x="20" y="20" width="3" height="40" fill="#A99AFF" opacity="0.4"/>
  <rect x="20" y="60" width="40" height="3" fill="#A99AFF" opacity="0.4"/>
  <rect x="360" y="240" width="3" height="40" fill="#A99AFF" opacity="0.4"/>
  <rect x="340" y="240" width="40" height="3" fill="#A99AFF" opacity="0.4"/>
  <text x="200" y="275" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">DenseNet121 · NIH ChestX-ray14</text>
  <text x="20" y="290" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10" text-anchor="start">Grad-CAM · Temperature Scaling</text>
</svg>
